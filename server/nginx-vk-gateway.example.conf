# Пример для Nginx на том же VPS: HTTPS → Node vk-gateway (127.0.0.1:5055)
# 1) certbot certonly --nginx -d api.ermakcentr.ru
# 2) Включите сайт: ln -s /etc/nginx/sites-available/vk-api /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name api.ermakcentr.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.ermakcentr.ru;

    # ssl_certificate /etc/letsencrypt/live/api.ermakcentr.ru/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.ermakcentr.ru/privkey.pem;

    location /vk-lead {
        proxy_pass http://127.0.0.1:5055;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
